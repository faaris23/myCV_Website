<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faaris Sayyid Al-Ghozali</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--cyan:#00f5ff;--blue:#0066ff;--glow:0 0 20px #00f5ff,0 0 60px #00f5ff50;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Rajdhani',sans-serif;}
canvas#bg{position:fixed;inset:0;z-index:0;}
.particles{position:fixed;inset:0;pointer-events:none;z-index:1;}
.particle{position:absolute;width:2px;height:2px;background:var(--cyan);border-radius:50%;animation:pfloat linear infinite;opacity:0;}
@keyframes pfloat{0%{transform:translateY(100vh);opacity:0;}10%{opacity:.6;}90%{opacity:.2;}100%{transform:translateY(-50px) translateX(var(--d,0px));opacity:0;}}
.scan{position:fixed;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:scan 4s linear infinite;z-index:2;pointer-events:none;opacity:.4;}
@keyframes scan{from{top:-1%;}to{top:101%;}}

.screen{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 20%,#001a4d 0%,#000b20 55%,#000 100%);
  transition:opacity .7s ease;
}
.screen.fade-out{opacity:0;pointer-events:none;}
.screen::before{
  content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(0,80,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,80,255,.07) 1px,transparent 1px);
  background-size:50px 50px;animation:gridY 10s linear infinite;
}
@keyframes gridY{from{background-position:0 0;}to{background-position:0 50px;}}
.screen::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.06) 3px,rgba(0,0,0,.06) 4px);}

.title-block{text-align:center;margin-bottom:52px;position:relative;}
.name1{
  font-family:'Orbitron',sans-serif;font-size:clamp(26px,4.5vw,52px);font-weight:900;
  color:#fff;letter-spacing:8px;text-transform:uppercase;
  text-shadow:var(--glow);position:relative;display:inline-block;
  animation:titleGlitch 7s infinite;
}
.name1::before,.name1::after{content:attr(data-t);position:absolute;top:0;left:0;width:100%;}
.name1::before{color:var(--cyan);clip-path:polygon(0 0,100% 0,100% 40%,0 40%);animation:gt 7s infinite;opacity:.7;}
.name1::after{color:#ff0044;clip-path:polygon(0 60%,100% 60%,100% 100%,0 100%);animation:gb 7s infinite;opacity:.7;}
@keyframes titleGlitch{0%,88%,100%{transform:none;}89%{transform:skewX(-1.5deg);}90%{transform:skewX(1.5deg);}91%{transform:none;}}
@keyframes gt{0%,88%,100%{transform:none;}89%{transform:translateX(-4px);}90%{transform:translateX(4px);}}
@keyframes gb{0%,88%,100%{transform:none;}89%{transform:translateX(4px);}90%{transform:translateX(-4px);}}
.name2{
  font-family:'Orbitron',sans-serif;font-size:clamp(18px,3vw,34px);font-weight:700;
  color:#fff;letter-spacing:6px;text-transform:uppercase;display:block;margin-top:2px;
  text-shadow:0 0 15px rgba(0,245,255,.6);
}
.hr{
  width:clamp(200px,55vw,500px);height:1px;margin:18px auto;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  box-shadow:var(--glow);
}
.role{font-family:'Rajdhani',sans-serif;font-size:clamp(13px,1.8vw,18px);color:var(--cyan);letter-spacing:6px;text-transform:uppercase;}
.meta{font-family:'Share Tech Mono',monospace;font-size:12px;color:rgba(0,245,255,.45);margin-top:6px;letter-spacing:2px;}

/* MODE CARDS */
.cards{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;}
.card{
  position:relative;width:250px;padding:30px 22px;cursor:pointer;
  border:1px solid rgba(0,245,255,.25);background:rgba(0,15,50,.65);
  backdrop-filter:blur(10px);text-align:center;overflow:hidden;
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));
  transition:all .3s;
}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,245,255,.06),transparent);opacity:0;transition:opacity .3s;}
.card:hover::after{opacity:1;}
.card:hover{border-color:rgba(0,245,255,.8);box-shadow:var(--glow),inset 0 0 40px rgba(0,245,255,.04);transform:translateY(-5px);}
.card:active{transform:translateY(0) scale(.97);}
.card .c{position:absolute;width:10px;height:10px;border-color:var(--cyan);border-style:solid;}
.c.tl{top:5px;left:5px;border-width:1.5px 0 0 1.5px;}
.c.tr{top:5px;right:5px;border-width:1.5px 1.5px 0 0;}
.c.bl{bottom:5px;left:5px;border-width:0 0 1.5px 1.5px;}
.c.br{bottom:5px;right:5px;border-width:0 1.5px 1.5px 0;}
.card-icon{font-size:44px;display:block;margin-bottom:14px;filter:drop-shadow(0 0 10px var(--cyan));transition:transform .3s;}
.card:hover .card-icon{transform:scale(1.12);}
.card-title{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;color:#fff;letter-spacing:4px;text-transform:uppercase;margin-bottom:10px;}
.card-desc{font-family:'Rajdhani',sans-serif;font-size:14px;color:rgba(255,255,255,.55);line-height:1.6;}
.card-badge{display:inline-block;margin-top:14px;padding:3px 12px;border:1px solid var(--cyan);border-radius:20px;font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--cyan);letter-spacing:2px;}

/* LOADING OVERLAY */
#loader{
  position:fixed;inset:0;z-index:50;
  background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  opacity:0;pointer-events:none;transition:opacity .4s;
}
#loader.show{opacity:1;pointer-events:all;}
.loader-text{font-family:'Share Tech Mono',monospace;font-size:14px;color:var(--cyan);letter-spacing:3px;}
.loader-bar-wrap{width:280px;height:3px;background:rgba(0,245,255,.15);border:1px solid rgba(0,245,255,.3);}
.loader-bar{height:100%;width:0;background:var(--cyan);box-shadow:0 0 10px var(--cyan);transition:width .05s;}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="particles" id="particles"></div>
<div class="scan"></div>

<div class="screen" id="screen">
  <div class="title-block">
    <span class="name1" data-t="FAARIS SAYYID">FAARIS SAYYID</span>
    <span class="name2">AL-GHOZALI</span>
    <div class="hr"></div>
    <p class="role">Game &amp; AR/VR Developer</p>
    <p class="meta">// UPNVYK · Informatics Engineering · Class 2022</p>
  </div>
  <div class="cards">
    <div class="card" id="simpleBtn">
      <div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div>
      <span class="card-icon">📄</span>
      <div class="card-title">Simple Mode</div>
      <p class="card-desc">Clean single-page portfolio. Quick to read, easy to share.</p>
      <span class="card-badge">FAST READ</span>
    </div>
    <div class="card" id="gameBtn">
      <div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div>
      <span class="card-icon">🚗</span>
      <div class="card-title">Game Mode</div>
      <p class="card-desc">Drive a car through a 3D cyberpunk city — discover my CV on the road.</p>
      <span class="card-badge">INTERACTIVE</span>
    </div>
  </div>
</div>

<div id="loader">
  <div class="loader-text" id="loaderText">INITIALIZING...</div>
  <div class="loader-bar-wrap"><div class="loader-bar" id="loaderBar"></div></div>
</div>

<script>
const c=document.getElementById('bg'),ctx=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight;}resize();
window.addEventListener('resize',resize);
const stars=Array.from({length:100},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.2+.3,t:Math.random()*Math.PI*2}));
(function loop(){ctx.clearRect(0,0,c.width,c.height);stars.forEach(s=>{s.t+=.012;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(0,210,255,${.15+.3*Math.sin(s.t)})`;ctx.fill();});requestAnimationFrame(loop);})();

const pc=document.getElementById('particles');
for(let i=0;i<35;i++){const p=document.createElement('div');p.className='particle';p.style.cssText=`left:${Math.random()*100}%;animation-duration:${7+Math.random()*10}s;animation-delay:-${Math.random()*15}s;--d:${(Math.random()-.5)*80}px;`;pc.appendChild(p);}

function loadAndGo(url,messages){
  document.getElementById('screen').classList.add('fade-out');
  const loader=document.getElementById('loader');
  const bar=document.getElementById('loaderBar');
  const txt=document.getElementById('loaderText');
  loader.classList.add('show');
  let i=0,w=0;
  const iv=setInterval(()=>{
    w+=Math.random()*6+2;if(w>100)w=100;
    bar.style.width=w+'%';
    if(i<messages.length)txt.textContent=messages[Math.floor(w/100*messages.length)]||messages[messages.length-1];
    if(w>=100){clearInterval(iv);setTimeout(()=>window.location.href=url,300);}
  },80);
}

document.getElementById('simpleBtn').onclick=()=>loadAndGo('simple.html',['LOADING PORTFOLIO...','COMPILING DATA...','RENDERING UI...','READY']);
document.getElementById('gameBtn').onclick=()=>loadAndGo('game.html',['LOADING ASSETS...','BUILDING CITY...','SPAWNING VEHICLE...','PLACING CV STOPS...','STARTING ENGINE...','READY']);
</script>
</body>
</html>
